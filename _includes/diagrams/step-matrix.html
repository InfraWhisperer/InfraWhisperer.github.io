<figcaption>
Eight consecutive engine steps on a single GPU. <b>A column is one <code>execute_model</code> call</b>, and every column here mixes prefill chunks with single decode tokens — the scheduler has no notion of a prefill phase to separate them. Request D is preempted at N+4 to free blocks for C and E, and is shown paying the worst case at N+6 — recomputing all 8189 of its tokens, which is what happens only if its freed blocks were evicted while it waited. The two decode-only steps schedule 3 and 4 tokens against an 8192 budget — under 0.05% of it — while still reading every weight in the model once.
</figcaption>
