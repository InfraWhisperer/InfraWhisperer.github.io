title: Raghav Potluri
tagline: Field notes from the plumbing under LLM traffic
description: >-
  Raghav Potluri — engineering notes on the infrastructure beneath large language
  models: distributed inference, prompt caching, and the telemetry that makes it
  debuggable.
url: "https://raghavpotluri.com"
baseurl: ""
lang: en

author:
  name: Raghav Potluri
  handle: InfraWhisperer

# jekyll-seo-tag uses this for the WebSite/Person JSON-LD sameAs — helps the page
# rank on the real name.
social:
  name: Raghav Potluri
  links:
    - https://github.com/InfraWhisperer
    - https://www.linkedin.com/in/raghav-potluri/

github_username: InfraWhisperer

# Cloudflare Web Analytics — privacy-first, no cookies, no consent banner.
# Setup: dash.cloudflare.com → Analytics & Logs → Web Analytics → Add a site
# (hostname: infrawhisperer.github.io), then copy the beacon "token" and paste it
# below. Leave empty to disable (no script is emitted when blank).
analytics:
  cloudflare_token: "7b043d09f6b0434b9c7fd54d0b0b4ea7"

permalink: /writing/:title/

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Paginates writing/index.html only (jekyll-paginate v1 drives the one page that
# sits at the root of paginate_path). Page 1 stays at /writing/.
paginate: 3
paginate_path: "/writing/page:num/"

# No jekyll-feed: /feed.xml is hand-written so posts and series instalments land in
# one feed. See the comment at the top of feed.xml.

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .gitignore

# Series instalments are NOT posts. Keeping them out of `site.posts` is what stops
# them appearing in Writing and in the paginator (jekyll-paginate slices site.posts
# wholesale and cannot be filtered, so a filtered loop would give uneven pages).
collections:
  series_posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: series_posts
    values:
      layout: post
