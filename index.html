---
layout: home
title: Raghav Potluri — LLM inference infrastructure
---

<section id="dives">
  <div class="wrap">
    <div class="section-head">
      <h2>Deep dives</h2>
      <span class="more">drafting</span>
    </div>
    <div class="dives">
      {% for i in (1..4) %}
      <article class="dive skeleton" aria-hidden="true">
        <span class="topic">// soon</span>
        <div class="skel">
          <span class="skel-bar" style="width:85%; height:1rem"></span>
          <span class="skel-bar" style="width:100%"></span>
          <span class="skel-bar" style="width:68%"></span>
        </div>
        <span class="foot">coming soon</span>
      </article>
      {% endfor %}
    </div>
  </div>
</section>

<section id="series">
  <div class="wrap">
    <div class="section-head">
      <h2>The series</h2>
      <span class="more">a four-part sequence</span>
    </div>
    <div class="series">
      {% for n in (1..4) %}
      <article class="series-item skeleton" aria-hidden="true">
        <span class="num">0{{ n }}</span>
        <div class="skel" style="gap:0.6rem">
          <span class="skel-bar" style="width:52%; height:1rem"></span>
          <span class="skel-bar" style="width:78%"></span>
        </div>
        <span class="tag">soon</span>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
