---
layout: default
---
<article class="post">
  <div class="post-head">
    <p class="meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {%- if page.topic %} · {{ page.topic }}{% endif -%}
      {%- if page.reading_time %} · {{ page.reading_time }}{% endif -%}
    </p>
    <h1>{{ page.title }}</h1>
  </div>
  <div class="prose">
    {{ content }}
  </div>
</article>
